<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turismo Extremo Sur</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css">

  <section id="inicio">

    <h2>Destinos</h2>

    <div class="card">
      <img src="./img/torres.jpg" alt="Torres del Paine">

      <img src="./img/glaciar.jpg" alt="Glaciares">
      <h3>Glaciares</h3>

  <section id="contacto">
    <h2>Contacto</h2>
    <p>Email: contacto@turismo.cl</p>
  </section>

  <footer>
    <p>© 2026 Turismo Extremo Sur</p>
  </footer>

  <!-- JS -->
  <script src="./script.js"></script>

</html>
